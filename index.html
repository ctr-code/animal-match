<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Match</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="app-bg">

    <nav class="navbar navbar-expand-lg app-navbar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold app-title" href="index.html">🐾 Animal Match</a>
            <div class="ms-auto">
                <button class="btn btn-link help-link text-decoration-none" type="button">
                    How to Play
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">

        <section id="hero" class="text-center mb-5">
            <h1 class="fw-bold mb-3">Choose an Animal Set</h1>
            <p class="app-subtitle mx-auto">
                Pick a theme and start matching animal descriptions to pictures!
            </p>
        </section>

        <main>
            <!-- GAME SECTION -->
            <section id="game-section" class="game-section py-4 py-md-5">
                <div class="container">

                    <!-- GAME HEADER / STATUS -->
                    <div id="game-status-bar" class="game-status-bar mb-4">
                        <div class="row g-3">
                            <div class="col-6 col-md-3">
                                <div class="status-card text-center" id="theme-card">
                                    <p class="status-label mb-1">Theme</p>
                                    <p class="status-value mb-0" id="theme-value">Land</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="status-card text-center" id="difficulty-card">
                                    <p class="status-label mb-1">Difficulty</p>
                                    <p class="status-value mb-0" id="difficulty-value">Easy</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="status-card text-center" id="question-progress-card">
                                    <p class="status-label mb-1">Question</p>
                                    <p class="status-value mb-0" id="question-count">1 / 8</p>
                                </div>
                            </div>

                            <div class="col-6 col-md-3">
                                <div class="status-card text-center" id="score-card">
                                    <p class="status-label mb-1">Score</p>
                                    <p class="status-value mb-0" id="score-value">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- PROGRESS BAR -->
                    <div id="progress-wrapper" class="progress-wrapper mb-4">
                        <div class="progress game-progress">
                            <div id="progress-bar" class="progress-bar game-progress-bar" role="progressbar"
                                style="width: 12.5%;" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
        </main>

</html>
